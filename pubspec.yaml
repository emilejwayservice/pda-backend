name: pda
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.20.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  go_router: ^14.6.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  loading_animation_widget: ^1.3.0
  lottie: ^3.1.3
  widget_and_text_animator: ^1.1.5
  font_awesome_flutter: ^10.8.0
  easy_stepper: ^0.8.5+1
  flutter_otp_text_field: ^1.2.0
  fluttertoast: ^8.2.10
  toastification: ^2.3.0
  bloc_concurrency: ^0.2.5
  dio: ^5.7.0
  flutter_bloc: ^8.1.6
  flutter_spinkit: ^5.2.1
  drop_down_list: ^0.0.8
  flutter_staggered_grid_view: ^0.7.0
  mobile_scanner: ^5.2.3
  syncfusion_flutter_pdf: ^24.1.46
  path_provider: ^2.1.5
  open_file: ^3.3.2
  qr: ^3.0.1
  image: ^4.3.0
  bluetooth_print_plus: ^2.4.5
  encrypt: ^5.0.3
  sqflite: ^2.3.3+1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
    
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/anim/
    - assets/products/
